<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayVideo</title>
<script src="https://cdn.tailwindcss.com"></script>

<!-- Video.js CSS & JS -->
<link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap');
    
    body { 
        font-family: 'Geist', sans-serif; 
        background: #0f1115; 
        color: #f3f4f6; 
    }

    .glass-btn {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .glass-btn:hover {
        background: rgba(255, 255, 255, 0.18);
        border-color: rgba(255, 255, 255, 0.3);
    }

    /* Personnalisation de Video.js */
    .video-js {
        width: 100%;
        height: 100%;
        border-radius: 0.75rem;
        background-color: #000;
    }
    .vjs-matrix.video-js {
        color: #f3f4f6;
    }
    .vjs-matrix .vjs-big-play-button {
        border-color: rgba(255, 255, 255, 0.4);
        background-color: rgba(0, 0, 0, 0.6);
        border-radius: 50%;
        width: 2em;
        height: 2em;
        line-height: 2em;
        margin-left: -1em;
        margin-top: -1em;
    }
    .vjs-matrix .vjs-control-bar {
        background-color: rgba(15, 17, 21, 0.85);
        backdrop-filter: blur(10px);
    }
    .vjs-matrix .vjs-play-progress {
        background-color: #ffffff;
    }
</style>
</head>
<body class="h-screen flex flex-col p-4 md:p-8 gap-6">

    <!-- HEADER -->
    <header class="flex items-center justify-between border-b border-white/10 pb-4">
        <div class="flex items-center gap-6">
            <h1 class="text-sm font-semibold tracking-[0.2em] uppercase text-white">Play<span class="text-gray-400">Video</span></h1>
            <div id="clock" class="text-xs font-mono tracking-widest text-gray-400 border-l border-white/10 pl-4">00:00:00</div>
        </div>
        <div class="flex gap-3">
            <button onclick="resetPlayer()" class="glass-btn px-4 py-2 rounded-full text-xs font-medium tracking-wider uppercase text-red-400 hover:text-red-300 transition">Reset</button>
            <button onclick="togglePanel()" class="glass-btn px-5 py-2 rounded-full text-xs font-medium tracking-wider uppercase text-gray-200 transition">Injecter</button>
        </div>
    </header>

    <!-- MAIN VIEWER -->
    <main class="flex-1 flex gap-6 overflow-hidden">
        <section id="player-container" class="flex-1 relative bg-black rounded-2xl overflow-hidden border border-white/10 flex items-center justify-center p-2">
            <div id="display-area" class="w-full h-full relative">
                <video
                    id="vjs-player"
                    class="video-js vjs-matrix vjs-big-play-centered"
                    controls
                    preload="auto">
                </video>
            </div>
        </section>
    </main>

    <!-- SLIDE PANEL -->
    <div id="sidePanel" class="fixed inset-y-0 right-0 w-full md:w-96 bg-[#14161d]/95 backdrop-blur-xl border-l border-white/10 p-8 transform translate-x-full transition-transform duration-300 z-50 flex flex-col justify-between">
        <div>
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-xs uppercase tracking-widest font-semibold text-gray-300">Source Configuration</h2>
                <button onclick="togglePanel()" class="text-gray-400 hover:text-white transition">✕</button>
            </div>
            <textarea id="mainInput" class="w-full h-48 bg-black/40 border border-white/10 rounded-xl p-4 text-xs text-gray-200 focus:outline-none focus:border-white/30 transition resize-none font-mono" placeholder="Collez votre URL (.mp4, .m3u8) ou code Iframe ici..."></textarea>
            <button onclick="processInput()" class="w-full mt-4 bg-white text-black py-3 rounded-xl text-xs font-semibold uppercase tracking-widest hover:bg-gray-200 transition shadow-lg">Charger le flux</button>
        </div>

        <div class="text-[10px] text-gray-500 uppercase tracking-widest text-center">
            PlayVideo Engine • Video.js & HLS Integration
        </div>
    </div>

    <script>
        setInterval(() => document.getElementById('clock').textContent = new Date().toLocaleTimeString('fr-FR'), 1000);

        let vjsPlayer = null;

        // Initialisation propre au chargement
        document.addEventListener('DOMContentLoaded', () => {
            vjsPlayer = videojs('vjs-player');
        });

        function togglePanel() { 
            document.getElementById('sidePanel').classList.toggle('translate-x-full'); 
        }

        function clearDisplay() {
            if (vjsPlayer) {
                vjsPlayer.dispose();
                vjsPlayer = null;
            }
            document.getElementById('display-area').innerHTML = '';
        }

        function processInput() {
            const input = document.getElementById('mainInput').value.trim();
            if(!input) return;

            clearDisplay();
            const container = document.getElementById('display-area');

            if (input.includes('<iframe')) {
                // Mode Iframe
                const src = (input.match(/src=["']([^"']+)["']/)||[])[1] || input;

                container.innerHTML = `
                    <iframe src="${src}" class="w-full h-full rounded-xl border border-white/10 bg-black" 
                        allowfullscreen="true" 
                        allow="autoplay; fullscreen; picture-in-picture; encrypted-media" 
                        sandbox="allow-scripts allow-same-origin allow-forms allow-presentation">
                    </iframe>
                `;
            } else {
                // Mode URL directe (.mp4, .m3u8)
                const videoType = input.includes('.m3u8') ? 'application/x-mpegURL' : 'video/mp4';
                
                container.innerHTML = `
                    <video id="vjs-player" class="video-js vjs-matrix vjs-big-play-centered" controls preload="auto">
                    </video>
                `;
                
                vjsPlayer = videojs('vjs-player');
                vjsPlayer.src({ src: input, type: videoType });
                vjsPlayer.play();
            }

            togglePanel();
        }

        function resetPlayer() {
            clearDisplay();
            const container = document.getElementById('display-area');
            
            container.innerHTML = `
                <video id="vjs-player" class="video-js vjs-matrix vjs-big-play-centered" controls preload="auto">
                </video>
            `;
            vjsPlayer = videojs('vjs-player');
            document.getElementById('mainInput').value = "";
        }
    </script>
</body>
</html>
